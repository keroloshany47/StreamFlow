global:
  scrape_interval: 10s
  scrape_timeout: 10s
  evaluation_interval: 10s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - timeout: "10s"
      scheme: http
      static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ---------------------------------------------------------------
  # Kafka Controllers — JMX Exporter on ports 9301/9302/9303
  # job label must match "kafka.*" for the CPU/GC dashboard panels
  # ---------------------------------------------------------------
  - job_name: kafka-controllers
    scrape_interval: 10s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "kafka-controller-1:9301"
          - "kafka-controller-2:9302"
          - "kafka-controller-3:9303"

  # ---------------------------------------------------------------
  # Kafka Brokers — JMX Exporter on ports 9401/9402/9403
  # Each broker gets a unique port because they share the same
  # Docker network (no per-container port isolation needed).
  # ---------------------------------------------------------------
  - job_name: kafka-brokers
    scrape_interval: 10s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "kafka-broker-1:9401"
          - "kafka-broker-2:9402"
          - "kafka-broker-3:9403"

  # ---------------------------------------------------------------
  # Elasticsearch — native Prometheus endpoint
  # ---------------------------------------------------------------
  - job_name: elasticsearch
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["elasticsearch:9200"]
    metrics_path: /_prometheus/metrics

  # ---------------------------------------------------------------
  # Spark Master — JMX Exporter on port 9404
  # Requires SPARK_DAEMON_JAVA_OPTS in docker-compose to load
  # the javaagent: see README for the required env var.
  # ---------------------------------------------------------------
  - job_name: spark
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["spark-master:9404"]
