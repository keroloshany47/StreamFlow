lowercaseOutputName: true
lowercaseOutputLabelNames: true
rules:
  # ---------------------------------------------------------------
  # BrokerTopicMetrics — explicit rules so metric names don't get
  # an extra _count / _value suffix from the catch-all below.
  # ---------------------------------------------------------------
  - pattern: kafka.server<type=BrokerTopicMetrics, name=BytesInPerSec><>OneMinuteRate
    name: kafka_server_brokertopicmetrics_bytesinpersec
    type: GAUGE

  - pattern: kafka.server<type=BrokerTopicMetrics, name=BytesOutPerSec><>OneMinuteRate
    name: kafka_server_brokertopicmetrics_bytesoutpersec
    type: GAUGE

  - pattern: kafka.server<type=BrokerTopicMetrics, name=MessagesInPerSec><>OneMinuteRate
    name: kafka_server_brokertopicmetrics_messagesinpersec
    type: GAUGE

  - pattern: kafka.server<type=BrokerTopicMetrics, name=BytesRejectedPerSec><>OneMinuteRate
    name: kafka_server_brokertopicmetrics_bytesrejectedpersec
    type: GAUGE

  # Per-topic breakdown (includes topic label)
  - pattern: kafka.server<type=BrokerTopicMetrics, name=BytesInPerSec, topic=(.+)><>OneMinuteRate
    name: kafka_server_brokertopicmetrics_bytesinpersec
    type: GAUGE
    labels:
      topic: "$1"

  - pattern: kafka.server<type=BrokerTopicMetrics, name=BytesOutPerSec, topic=(.+)><>OneMinuteRate
    name: kafka_server_brokertopicmetrics_bytesoutpersec
    type: GAUGE
    labels:
      topic: "$1"

  - pattern: kafka.server<type=BrokerTopicMetrics, name=MessagesInPerSec, topic=(.+)><>OneMinuteRate
    name: kafka_server_brokertopicmetrics_messagesinpersec
    type: GAUGE
    labels:
      topic: "$1"

  # ---------------------------------------------------------------
  # ReplicaManager
  # ---------------------------------------------------------------
  - pattern: kafka.server<type=ReplicaManager, name=(.+)><>Value
    name: kafka_server_replicamanager_$1
    type: GAUGE

  - pattern: kafka.server<type=ReplicaManager, name=(.+)><>(\w+)
    name: kafka_server_replicamanager_$1_$2
    type: COUNTER

  # ---------------------------------------------------------------
  # Controller
  # ---------------------------------------------------------------
  - pattern: kafka.controller<type=(.+), name=(.+)><>Value
    name: kafka_controller_$1_$2
    type: GAUGE

  - pattern: kafka.controller<type=KafkaController, name=(.+)><>Value
    name: kafka_controller_kafkacontroller_$1
    type: GAUGE

  - pattern: kafka.controller<type=ControllerStats, name=(.+)><>OneMinuteRate
    name: kafka_controller_controllerstats_$1
    type: GAUGE

  # ---------------------------------------------------------------
  # Broker general (clientId / topic / partition)
  # ---------------------------------------------------------------
  - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), topic=(.+), partition=(.*)><>Value
    name: kafka_server_$1_$2
    type: GAUGE
    labels:
      clientId: "$3"
      topic: "$4"
      partition: "$5"

  - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), brokerHost=(.+), brokerPort=(.+)><>Value
    name: kafka_server_$1_$2
    type: GAUGE
    labels:
      clientId: "$3"
      broker: "$4:$5"

  - pattern: kafka.server<type=(.+), name=(.+)><>Value
    name: kafka_server_$1_$2
    type: GAUGE

  # ---------------------------------------------------------------
  # Network
  # ---------------------------------------------------------------
  - pattern: kafka.network<type=(.+), name=(.+), request=(.+), (.+)=(.+)><>Value
    name: kafka_network_$1_$2
    type: GAUGE
    labels:
      request: "$3"
      "$4": "$5"

  - pattern: kafka.network<type=(.+), name=(.+), request=(.+)><>Value
    name: kafka_network_$1_$2
    type: GAUGE
    labels:
      request: "$3"

  - pattern: kafka.network<type=(.+), name=(.+)><>Value
    name: kafka_network_$1_$2
    type: GAUGE

  # ---------------------------------------------------------------
  # Log
  # ---------------------------------------------------------------
  - pattern: kafka.log<type=(.+), name=(.+), topic=(.+), partition=(.+)><>Value
    name: kafka_log_$1_$2
    type: GAUGE
    labels:
      topic: "$3"
      partition: "$4"

  # ---------------------------------------------------------------
  # JVM — names aligned with what the dashboard actually queries
  # ---------------------------------------------------------------

  # process_cpu_seconds_total  (dashboard: rate(process_cpu_seconds_total{job=~"kafka.*"}[5m]))
  - pattern: 'java.lang<type=OperatingSystem><>ProcessCpuTime'
    name: process_cpu_seconds_total
    type: COUNTER
    valueFactor: 0.000000001   # nanoseconds → seconds

  # jvm_gc_collection_seconds_sum  (dashboard: rate(jvm_gc_collection_seconds_sum{...}[5m]))
  - pattern: 'java.lang<type=GarbageCollector, name=(.+)><>CollectionTime'
    name: jvm_gc_collection_seconds_sum
    type: COUNTER
    labels:
      gc: "$1"
    valueFactor: 0.001         # milliseconds → seconds

  - pattern: 'java.lang<type=GarbageCollector, name=(.+)><>CollectionCount'
    name: jvm_gc_collection_count
    type: COUNTER
    labels:
      gc: "$1"

  # Heap / non-heap memory
  - pattern: 'java.lang<type=Memory><HeapMemoryUsage>(\w+)'
    name: jvm_memory_heap_$1
    type: GAUGE

  - pattern: 'java.lang<type=Memory><NonHeapMemoryUsage>(\w+)'
    name: jvm_memory_nonheap_$1
    type: GAUGE

  # Threading
  - pattern: 'java.lang<type=Threading><>(\w+ThreadCount)'
    name: jvm_threading_$1
    type: GAUGE

  # File descriptors
  - pattern: 'java.lang<type=OperatingSystem><>(OpenFileDescriptorCount|MaxFileDescriptorCount)'
    name: jvm_os_$1
    type: GAUGE
